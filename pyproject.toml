[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quickverdict"
version = "0.1.0"
description = "Local, open-source System One decision server: calibrated Choice/Score/Noul answers on your own GPU, TypeSafe-API compatible."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jan (janmm97)" }]
keywords = ["llm", "classification", "calibration", "system-one", "local-ai", "typesafe"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.7",  # 2.7+ (CUDA 12.8 wheels) is the first with RTX 50-series kernels
  "transformers>=4.56",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "zstandard>=0.22",
  "accelerate>=1.0",  # --device auto and 4-bit loading
  "bitsandbytes>=0.45; sys_platform != 'darwin'",  # lets --model auto fit bigger models in 4-bit on NVIDIA
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "typesafe-sdk[zstd]>=0.7"]
4bit = []  # kept so old install lines work; 4-bit support is now built in
bench = ["datasets>=2.19", "bm25s>=0.2", "PyStemmer>=2.2", "typesafe-sdk>=0.7"]

[project.scripts]
quickverdict = "quickverdict.cli:main"

[project.urls]
Homepage = "https://github.com/janmm97/quickverdict"
Issues = "https://github.com/janmm97/quickverdict/issues"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip() strict= is noise here: lengths are equal by construction

[tool.pytest.ini_options]
testpaths = ["tests"]
